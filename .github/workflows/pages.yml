name: Website

# Builds the project website (website/, Astro) together with the current JavaDoc and publishes it to
# GitHub Pages at https://stuntmock.openbrod.org (custom domain: website/public/CNAME).
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'src/main/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site and JavaDoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: JavaDoc
        run: ./gradlew javadoc --no-daemon
      - name: Copy JavaDoc into the site
        run: |
          rm -rf website/public/javadoc
          cp -r build/docs/javadoc website/public/javadoc
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build site
        working-directory: website
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
